<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="compatible" content="IE=edge">
    <link rel="stylesheet" href="style.css">
    <title>포켓몬</title>
</head>
<body>


    <div class="container">
        <div class="logobox">
            <div class="logo"></div>
        </div>
        <div class="poket">
            <div class="poketball"></div>
            <div class="light"></div>
            <div id="image"></div>
        </div>
        <div class="info">
            <h1 id="name">이름 :  </h1>
            <p id="information">설명 :  </p>
            <br>
            <hr>
            <p id="types">유형 : </p>
            <br>
            <p id="moves">기술 : </p>
            <br>
            <p id="stats">능력치 : </p>
                
        </div>
        <div class="button">
            <div id="re">다시 뽑기</div>
            <div id="evo">진화하기</div>
        </div>
    </div>  



    <script src="script.js"></script>
</body>
</html>
